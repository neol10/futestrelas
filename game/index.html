<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Futebol de Botão 2D</title>
  <style>[hidden]{display:none!important}</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <!-- PeerJS via CDN (necessário para modo online na Vercel) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <h1>Futebol de Botão 2D</h1>
        <span class="subtitle">2 jogadores locais • Canvas • Física + Power-ups</span>
      </div>
      <div class="actions">
        <button id="btnFullscreen" class="btn secondary" type="button">Tela cheia</button>
        <button id="btnBack" class="btn secondary" type="button" hidden>Voltar</button>
        <button id="btnRestart" class="btn secondary" type="button" hidden>Reiniciar</button>
      </div>
    </header>

    <main id="main">
      <section id="screenMenu" class="screen">
        <h2>Menu Inicial</h2>
        <div class="panel">
          <div class="grid selectorGrid">
            <div class="playerSelector">
              <label>Jogador 1</label>
              <div id="p1TeamList" class="teamList"></div>
            </div>
            <div class="playerSelector">
              <label>Jogador 2</label>
              <div id="p2TeamList" class="teamList"></div>
            </div>
          </div>
          <div class="row" style="gap: 12px;">
            <button id="btnStartQuickMatch" class="btn primary" type="button" style="flex: 1;">Jogar Local</button>
            <button id="btnOpenOnline" class="btn secondary" type="button" style="flex: 1;">Jogar Online</button>
            <button id="btnGoConfig" class="btn secondary" type="button">⚙️</button>
          </div>
        </div>
      </section>

      <section id="screenOnline" class="screen" hidden>
        <h2>Modo Online (Beta)</h2>
        <div class="panel">
          <div class="onlineGrid">
            <div class="onlineSection">
              <h3>Criar Partida</h3>
              <p class="hint">Mande este código para seu amigo:</p>
              <div class="copyBox">
                <code id="myPeerId">Carregando...</code>
                <button id="btnCopyId" class="btn small">Copiar</button>
              </div>
            </div>
            
            <div class="onlineDivider"><span>OU</span></div>

            <div class="onlineSection">
              <h3>Entrar em Partida</h3>
              <p class="hint">Cole o código do seu amigo abaixo:</p>
              <div class="inputRow">
                <input type="text" id="remotePeerId" placeholder="MAMO-XXXX-..." />
                <button id="btnConnect" class="btn primary">Conectar</button>
              </div>
            </div>
          </div>
          <div class="row">
            <button id="btnOnlineBack" class="btn secondary">Voltar ao Menu</button>
          </div>
        </div>
      </section>

      <section id="screenConfig" class="screen" hidden>
        <h2>Configuração da Partida</h2>
        <div class="panel">
          <div class="grid">
            <div class="field">
              <label for="controlMode">Modo de controle</label>
              <select id="controlMode">
                <option value="drag" selected>Arrastar e soltar</option>
                <option value="keyboard">2 jogadores no teclado</option>
              </select>
            </div>

            <div class="field">
              <label for="matchTime">Tempo da partida</label>
              <select id="matchTime">
                <option value="30">30s</option>
                <option value="60" selected>60s</option>
                <option value="120">120s</option>
                <option value="infinite">infinito</option>
              </select>
            </div>

            <div class="field">
              <label for="maxGoals">Máximo de gols</label>
              <select id="maxGoals">
                <option value="1">1</option>
                <option value="3" selected>3</option>
                <option value="5">5</option>
              </select>
            </div>

            <div class="field">
              <label for="botsPerTeam">Bots por time</label>
              <select id="botsPerTeam">
                <option value="1">1 vs 1</option>
                <option value="2">2 vs 2</option>
                <option value="3" selected>3 vs 3</option>
                <option value="4">4 vs 4</option>
                <option value="5">5 vs 5</option>
                <option value="6">6 vs 6</option>
                <option value="7">7 vs 7</option>
                <option value="8">8 vs 8</option>
                <option value="9">9 vs 9</option>
                <option value="10">10 vs 10</option>
              </select>
            </div>

            <div class="field">
              <label for="difficulty">Dificuldade da IA</label>
              <select id="difficulty">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Profissional</option>
              </select>
            </div>

            <div class="field">
              <label for="botDifficulty">Dificuldade dos Bots</label>
              <select id="botDifficulty">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Profissional</option>
              </select>
            </div>

            <div class="field">
              <label for="goalieDifficulty">Dificuldade do Goleiro</label>
              <select id="goalieDifficulty">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Profissional</option>
              </select>
            </div>

            <div class="field">
              <label class="inline">
                <input id="powerUpsEnabled" type="checkbox" checked />
                Ativar power-ups
              </label>
            </div>

            <div class="field">
              <label for="powerSpawnInterval">Frequência de spawn (s)</label>
              <input id="powerSpawnInterval" type="range" min="3" max="20" step="1" value="8" />
              <div class="hint"><span id="powerSpawnIntervalValue">8</span>s</div>
            </div>

            <div class="field">
              <label for="powerDuration">Duração do power (s)</label>
              <input id="powerDuration" type="range" min="3" max="20" step="1" value="8" />
              <div class="hint"><span id="powerDurationValue">8</span>s</div>
            </div>

            <div class="field">
              <label class="inline">
                <input id="goalieAuto" type="checkbox" checked />
                Goleiro automático
              </label>
            </div>

            <div class="field">
              <label class="inline">
                <input id="soundEnabled" type="checkbox" checked />
                Sons do jogo
              </label>
            </div>

            <div class="field">
              <label for="gameSpeed">Velocidade do jogo</label>
              <input id="gameSpeed" type="range" min="0.5" max="1.5" step="0.05" value="1" />
              <div class="hint"><span id="gameSpeedValue">1.00</span>x</div>
            </div>

            <div class="field">
              <label for="weatherMode">🌤️ Clima do Estádio</label>
              <select id="weatherMode">
                <option value="clear" selected>☀️ Ensolarado</option>
                <option value="rain">🌧️ Chuva</option>
                <option value="snow">❄️ Neve</option>
                <option value="wind">💨 Vento</option>
                <option value="storm">⛈️ Tempestade</option>
              </select>
            </div>
          </div>

          <div class="row">
            <button id="btnStartMatch" class="btn primary" type="button">Iniciar partida</button>
          </div>
        </div>
      </section>

      <section id="screenGame" class="screen fullScreen" hidden>
        <div id="hud" class="hud">
          <div class="scoreboard">
            <div class="scoreTeams">
              <span id="p1Label">J1</span>
              <strong id="hudScore">0 - 0</strong>
              <span id="p2Label">J2</span>
            </div>
            <div class="scoreTime" id="hudTime">60</div>
          </div>
        </div>

        <div id="canvasWrap" class="canvasWrap">
          <canvas id="gameCanvas"></canvas>
        </div>
        <div id="popStack" class="popStack" aria-live="polite" aria-atomic="true"></div>
        <div id="toast" class="toast" hidden></div>

        <!-- Controles Móveis (Visíveis apenas em Touch) -->
        <div id="mobileControls" class="mobile-controls">
          <div class="joystick-zone" id="joystickZone">
            <div class="joystick-base">
              <div class="joystick-stick" id="joystickStick"></div>
            </div>
          </div>
          <div class="action-buttons">
            <button id="btnMobilePower" class="btn-mobile power-btn">⚡</button>
            <button id="btnMobileSwitch" class="btn-mobile switch-btn">🔄</button>
            <div class="main-actions">
              <button id="btnMobileDash" class="btn-mobile dash-btn">DASH</button>
              <button id="btnMobilePass" class="btn-mobile pass-btn">PASSE</button>
              <button id="btnMobileKick" class="btn-mobile kick-btn">CHUTE</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="main.js?v=20260513"></script>
</body>
</html>
